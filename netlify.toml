# Static site — nothing to build. Netlify reads this so the deploy settings
# don't have to be typed in by hand.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# These filenames are stable and get overwritten in place (hero.jpg stays
# hero.jpg when the photo changes), so they must NOT be cached immutably —
# a year-long cache means a replaced photo never reaches returning visitors.
# Short cache + revalidation: Netlify sends an ETag, so an unchanged file
# costs a 304 and nothing more.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"
[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# uploaded enquiry photos DO have unguessable one-off ids, so these are safe
# to cache hard — that rule lives in netlify/functions/photo.mjs

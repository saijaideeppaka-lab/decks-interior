# Static site — nothing to build. Netlify reads this so the deploy settings
# don't have to be typed in by hand.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# hashed-forever assets can cache hard; the HTML must not
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — Decks Interior</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Source+Serif+4:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    background:#091624;color:#eff1ef;font-family:Archivo,Helvetica,Arial,sans-serif;padding:32px}
  .dot{width:14px;height:14px;border-radius:50%;background:#7ee3ab;display:inline-block;vertical-align:middle;margin-right:10px}
  .mark{font-weight:800;letter-spacing:.2em;font-size:14px;text-transform:uppercase}
  h1{font-size:clamp(30px,6vw,54px);text-transform:uppercase;letter-spacing:-.02em;margin:30px 0 0;line-height:1.02}
  h1 span{color:#7ee3ab;display:block}
  p{color:#9aabb6;max-width:42ch;margin:20px auto 0;line-height:1.6}
  .btn{display:inline-flex;margin-top:34px;padding:14px 24px;border-radius:2px;background:#7ee3ab;color:#091624;
    text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase}
  .tag{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:300;margin-top:46px;color:#59a381}
</style>
</head>
<body>
  <div>
    <div><span class="dot"></span><span class="mark">Decks Interior</span></div>
    <h1>Thanks.<span>We've got it.</span></h1>
    <p>Your enquiry is in. We'll give you a call back with a price — usually the same day,
       and always within one working day.</p>
    <a class="btn" href="/">Back to the site</a>
    <p class="tag">Luxury is in the details.</p>
  </div>
</body>
</html>
